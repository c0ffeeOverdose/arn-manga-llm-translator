name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node build.mjs
      - run: node build.mjs --firefox
      - run: npx --yes addons-linter@10 dist-firefox/ --self-hosted

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tag matches package.json version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' != package.json ' + require('./package.json').version); process.exit(1); }"
      - run: node build.mjs --release
      - run: node build.mjs --release --firefox
      - name: byte-identical rebuild check
        run: |
          sha256sum arn-manga-*.zip > /tmp/first.sums
          node build.mjs --release
          node build.mjs --release --firefox
          sha256sum -c /tmp/first.sums
      - name: attach zips to the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes arn-manga-*.zip || gh release upload "$GITHUB_REF_NAME" arn-manga-*.zip --clobber
